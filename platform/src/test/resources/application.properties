# Test defaults. Only what has to differ from production, with the reason.
#
# Kafka listeners do not start under test unless a test asks for them.
#
# Nine @SpringBootTest classes point `spring.kafka.bootstrap-servers` at a
# deliberately dead port because they are about the HTTP layer and say so. The
# listeners started anyway, and `KafkaConsumer.close()` against an unreachable
# broker blocks for its thirty-second default — measured at 29.97, 28.61, 29.62,
# 29.81, 27.95 and 30.09 seconds during context teardown, a hundred and
# seventy-nine seconds of a thirteen-minute build, plus two thousand eight
# hundred connection warnings drowning the log while it happened. The first
# @SpringBootTest class pays 0.14s because it has nothing to close, which is what
# proves the attribution.
#
# This is a default, not a ban. A test that wants a listener running turns it
# back on for itself — `KafkaOutboxPublisherTests` drives a real broker and is
# not a @SpringBootTest, so it is unaffected either way.
spring.kafka.listener.auto-startup=false

# Topic provisioning is an application-start concern, not a prerequisite for an
# HTTP or JDBC test that deliberately points Kafka at a dead port. Production
# keeps the KafkaAdmin fail-fast guard enabled; these suites prove contracts
# without needing a broker unless a test explicitly starts one.
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false

# The same argument for ADR 0045's realtime consumer, which is @ConditionalOnProperty
# with matchIfMissing = true and therefore also always started.
horecaos.realtime.signals.consume=false

# ADR 0139. The staff member reconciler backfills a row for every subject that
# holds an active job and has none, and the retention sweeper reports on ended
# employees. Both read what a test has just seeded, and a scheduler inserting
# rows under a test that counts them is not a test. Production runs both; a test
# that wants one calls it directly.
horecaos.iam.staff-members.reconcile.enabled=false
horecaos.iam.staff-members.retention.enabled=false

# ADR 0140 / ADR 0019, row 6.1. The scheduled-order re-quote sweep prices real orders on a timer and
# writes a quote for each. A test that wants it calls ScheduledOrderRequoteWorker#sweepOnce with the
# instant it is about; every other test is left with the quotes it counts.
horecaos.ordering.scheduled-requote.enabled=false

# No @Scheduled job runs under test. Hotfix 2026-10-09.
#
# About 170 @SpringBootTest classes clean their private database with
# `TRUNCATE TABLE tenant.tenants CASCADE` (and a dozen siblings) in @BeforeEach,
# inside a context whose scheduler keeps polling the same database on a timer.
# TRUNCATE ... CASCADE takes ACCESS EXCLUSIVE locks on every table that
# references the one it names, one after another; a sweeper's SELECT takes
# ACCESS SHARE locks on the two or three tables it joins, one after another, in
# its own order. Two sessions acquiring overlapping lock sets in different
# orders is a deadlock by construction, and PostgreSQL picks a victim after
# deadlock_timeout. CI run 37895167519 (2026-10-09) logged it both ways: the
# sweeper was the victim when MarketplaceAvailabilityScheduler's
# bindings/installations join and OrderProcessWorker.fireDueTimers' claim
# statement were chosen, and the TRUNCATE was the victim in
# PriceBookMatrixEndpointTests and PartnerAvailabilityHttpTests. Three of the
# last four runs failed this way, a different class each time, and each class
# passed on re-run — the signature of a race, not of a defect in any one test.
#
# ADR 0023's role switch is the existing, supported way to say "this process runs
# no scheduled work": role `app` drops SchedulingConfiguration — and with it the
# one @EnableScheduling, the ScheduledAnnotationBeanPostProcessor and the
# scheduler pool — so no @Scheduled method on any module fires, including ones
# added after this line. It also drops the three inbox Kafka listener beans,
# which `spring.kafka.listener.auto-startup=false` above already kept from
# starting; nothing under test autowires them.
#
# The role alone is not enough, and a first version of this change that set only
# the role still showed MarketplaceAvailabilityScheduler.tick deadlocking on a
# `pool-N-thread-1` thread: spring-modulith-moments, which arrives transitively
# with the Modulith starters, ships MomentsAutoConfiguration, and that class
# carries its own @EnableScheduling. It registers the same
# ScheduledAnnotationBeanPostProcessor the role removed, so every @Scheduled
# method ran anyway, serialised on Spring's fallback single-thread executor.
# Nothing here consumes its HourHasPassed / DayHasPassed events (no source file
# or record mentions them), so under test it is switched off as well.
#
# This is a default, not a ban, in the same spirit as the Kafka default above. A
# test that wants a job calls it directly (`sweepOnce`, `tick(Instant)`, ...),
# which is what every sweeper suite here already does; a test that needs the
# real timers running opts back in for itself with
# `registry.add("horecaos.runtime.role", () -> "both")`. SchedulerPoolSizeTests,
# RuntimeRoleSchedulingTests and ProcessFatalErrorTests build their own scheduler
# or their own ApplicationContextRunner, which never reads this file, so they
# keep testing the scheduler exactly as before. TestProfileSchedulingTests boots
# a real context and fails if anything puts the scheduling post-processor back.
horecaos.runtime.role=app
spring.modulith.moments.enabled=false

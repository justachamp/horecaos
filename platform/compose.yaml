name: horecaos-platform

services:
  platform-db:
    # PostgreSQL 18 with PostGIS — see infra/postgres/Dockerfile for why this is
    # built here rather than pulled. ADR 0037 stores delivery zones as geometry.
    #
    # Two roles, exactly as in compose.production.yaml, and for the reason that
    # file gives: `horecaos_migrator` owns every object and is the only role that can
    # change the schema; the application connects as `horecaos_app`, which owns
    # nothing and holds only what a migration granted it by name.
    #
    # This used to be a single `horecaos` superuser that also owned the database, so
    # every GRANT and REVOKE in sixty-one migrations was bypassed locally and in
    # every test — including the REVOKE that makes the audit trail immutable. The
    # privileges were only ever real in production, which is the same as saying
    # they were never tested.
    #
    # !! Changing POSTGRES_USER does not re-initialise an existing volume. A
    # !! checkout that already has `platform-db-data` will start a server with no
    # !! `horecaos_migrator` role and fail its healthcheck. Recreate it once:
    # !!     docker compose down -v && docker compose up -d
    # !! Local data is disposable; that is the only reason this is acceptable.
    build: ./infra/postgres
    image: horecaos/postgres-postgis:18
    environment:
      POSTGRES_DB: horecaos
      POSTGRES_USER: horecaos_migrator
      POSTGRES_PASSWORD: horecaos_migrator
      # Read by the init script below. Production takes the same value from a
      # tmpfs that deploy.sh fills from OpenBao; there is no OpenBao at initdb
      # time and no secret mount here, and this value is as worthless outside a
      # laptop as every other credential in this file.
      HORECAOS_APP_PASSWORD: horecaos_app
    ports:
      - "5432:5432"
    volumes:
      - platform-db-data:/var/lib/postgresql/18/docker
      # The same script production mounts, not a local copy of it. A local
      # variant would drift, and the drift would be invisible until a deploy.
      - ./infra/production/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horecaos_migrator -d horecaos"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
      - "9001:9000"
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  openbao:
    # ADR 0028: the secrets manager for phase one. Dev mode keeps an in-memory
    # store with a fixed root token, which is correct for local work and is the
    # reason SecretsProfileGuard refuses to let a non-local profile run on it.
    image: openbao/openbao:2.4.1
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      BAO_DEV_ROOT_TOKEN_ID: horecaos-local-root
      BAO_ADDR: http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  openbao-seed:
    # Seeds the secrets the platform expects locally, so a fresh checkout starts
    # without anyone pasting values by hand. Every value here is deliberately
    # worthless outside this machine.
    image: openbao/openbao:2.4.1
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
      BAO_TOKEN: horecaos-local-root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        bao secrets enable -path=horecaos -version=2 kv 2>/dev/null || true
        bao kv put horecaos/local/data_encryption/platform/kek \
          value=local-development-key-encryption-key-not-for-any-other-use
        # These must equal the fallback client secrets the realm import falls
        # back to when HORECAOS_KEYCLOAK_PROVISIONING_SECRET and
        # _READER_SECRET are unset (see infra/keycloak/realm/horecaos-realm.json
        # and infra/keycloak/README.md, "Secrets"). This seed used to write a
        # different value than what Keycloak actually issued, so the ADR 0009
        # adapter's client-credentials login failed with every checkout on a
        # stock `docker compose up` — reconciled 2026-08-30, one canonical
        # local value per client, set in both places.
        bao kv put horecaos/local/identity_admin/keycloak/provisioning-secret \
          value=development-only-not-a-secret-provisioning
        bao kv put horecaos/local/identity_admin/keycloak/reader-secret \
          value=development-only-not-a-secret-reader
        # ADR 0062: horecaos-staff-login, the confidential direct-grant client
        # the backend alone uses to exchange staff credentials with Keycloak.
        # Same reconciliation requirement as the two secrets above -- this
        # value must equal the realm import's fallback for that client, or a
        # checkout on the "environment"/OpenBao default path signs in nobody.
        bao kv put horecaos/local/identity_admin/keycloak/staff-login-secret \
          value=development-only-not-a-secret-staff-login
        # These two close a gap docs/development.md's own documented dev loop
        # falls into: running `make run` with HORECAOS_SECRETS_PROVIDER=openbao
        # (.env.example's own recommended way to exercise the OpenBao path
        # rather than the "environment" provider default) previously failed
        # application startup outright — ObjectStorageConfiguration.s3Client
        # and PartnerConfiguration.handoverCodeHasher both resolve their
        # secret eagerly at bean construction, and only data_encryption/kek
        # and the two identity_admin values above were ever seeded here. The
        # values match application.yml's own "environment" provider fallbacks
        # (HORECAOS_MEDIA_ACCESS_KEY / _SECRET_KEY and HORECAOS_HANDOVER_PEPPER),
        # so behaviour is identical whichever provider a checkout ends up on.
        bao kv put horecaos/local/object_storage/platform/media-access-key \
          value=horecaos
        bao kv put horecaos/local/object_storage/platform/media-secret-key \
          value=horecaos-local-secret
        bao kv put horecaos/local/data_encryption/platform/handover-pepper \
          value=horecaos-local-handover-pepper-not-for-use
        echo "seeded horecaos local secrets"

  object-store:
    # ADR 0034/0135: stands in for the off-site object store until a real
    # bucket exists. Everything above it — the backup script, the encryption,
    # the restore procedure — is the same either way, so switching destination
    # is configuration rather than a rewrite.
    #
    # RustFS, not MinIO (ADR 0135, 2026-09-25). MinIO's public images were
    # withdrawn: quay.io/minio/minio answers 401 anonymously and Docker Hub's
    # minio/minio is 404, so a fresh checkout could no longer pull it. RustFS
    # is the S3-compatible replacement, pinned by digest like every other
    # third-party image here. Its on-disk layout is NOT MinIO's — an old
    # `minio-data` volume cannot be mounted into this container, which is why
    # the volume below has a new name rather than reusing one.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: horecaos
      RUSTFS_SECRET_KEY: horecaos-local-secret
      # Off, same as production: object-store-seed and infra/backup/*.sh only
      # ever need the S3 API, and a second authenticated surface bought
      # nothing when MinIO's console was here either (MINIO_BROWSER: "off"
      # in the production compose files, never set to "on" in this one).
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - object-store-data:/data
    healthcheck:
      # RustFS ships no `mc`; curl is on the image and is what its own docs
      # use for this. CMD, not CMD-SHELL — the image has /bin/sh but no
      # bash, and CMD needs no shell to begin with.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          # `minio`, for one release only. HORECAOS_MEDIA_ENDPOINT and
          # HORECAOS_AUDIT_ARCHIVE_ENDPOINT still default to http://minio:9000
          # in application.yml and the env examples, BackupScriptTests hands
          # backup.sh that same literal endpoint, and several Testcontainers
          # test classes still start a container named `minio`. This alias
          # keeps all of them resolving while each is migrated to
          # `object-store` on its own schedule. Remove once nothing in the
          # repository names `minio` any more (`grep -rl minio`) — tracked in
          # ADR 0135.
          - minio

  object-store-offsite:
    # ADR 0034/0135: stands in for the off-site destination. A second instance
    # rather than a second bucket, because the risk being modelled is losing
    # the primary host entirely — a bucket on the same server proves nothing
    # about that.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: horecaos
      RUSTFS_SECRET_KEY: horecaos-offsite-secret
      RUSTFS_CONSOLE_ENABLE: "false"
    ports:
      - "9002:9000"
    volumes:
      - object-store-offsite-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          # `minio-offsite` — same one-release reasoning as object-store's own
          # `minio` alias, above.
          - minio-offsite

  object-store-seed:
    # AWS CLI replaces `mc`: MinIO's mc image is gone from every registry the
    # same way the server image is, and RustFS ships no client of its own.
    # Every `mc` subcommand this used to run has a documented `aws s3`/`s3api`
    # equivalent (ADR 0135) — infra/backup/README.md has the mapping this
    # repository settled on.
    image: amazon/aws-cli:2.37.3@sha256:83f8ffe939569070c5b66d22231862ab78718766d9d8e4c44ca84dd0be5569a5
    depends_on:
      object-store:
        condition: service_healthy
      object-store-offsite:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: horecaos
      AWS_DEFAULT_REGION: us-east-1
      # Nothing here has a route to the EC2 metadata service, and without
      # this the CLI still tries it and eats a connect timeout before falling
      # back to the environment credentials actually set below.
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # BucketAlreadyOwnedByYou (create-bucket failing because the bucket is
        # already there, owned by these same credentials) is fine on a rerun;
        # anything else means the store is not actually reachable or usable,
        # and that must fail the seed job rather than being swallowed.
        #
        # Every `$$` below is a literal `$` for the container's shell, doubled
        # so that `docker compose config` does not try to interpolate these as
        # ITS OWN variables (`endpoint` and `bucket` are not compose
        # variables; they are this function's own shell locals).
        create_bucket() {
          endpoint="$$1"; bucket="$$2"; shift 2
          if ! aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket" "$$@" >/dev/null 2>&1; then
            aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 \
              || { echo "!! could not create or find bucket $$bucket at $$endpoint" >&2; exit 1; }
            echo "    $$bucket already exists at $$endpoint"
          else
            echo "    created $$bucket at $$endpoint"
          fi
        }

        export AWS_SECRET_ACCESS_KEY=horecaos-local-secret
        create_bucket http://object-store:9000 horecaos-backups
        aws --endpoint-url http://object-store:9000 s3api put-bucket-versioning \
          --bucket horecaos-backups --versioning-configuration Status=Enabled

        export AWS_SECRET_ACCESS_KEY=horecaos-offsite-secret
        create_bucket http://object-store-offsite:9000 horecaos-backups
        aws --endpoint-url http://object-store-offsite:9000 s3api put-bucket-versioning \
          --bucket horecaos-backups --versioning-configuration Status=Enabled
        echo "created horecaos-backups with versioning on both sites"

        # ADR 0027 archival. --object-lock-enabled-for-bucket is Object Lock,
        # which RustFS (like S3, and MinIO before it) only accepts at bucket
        # creation and which implies versioning — there is no later API call
        # that retrofits it onto an existing bucket, which is exactly why
        # AuditArchiveStorageConfiguration's own doc says protection is a
        # property of how this bucket was made, not of what a PutObject call
        # asks for afterwards.
        export AWS_SECRET_ACCESS_KEY=horecaos-local-secret
        create_bucket http://object-store:9000 horecaos-audit-archive --object-lock-enabled-for-bucket
        echo "created horecaos-audit-archive with Object Lock enabled"

volumes:
  object-store-data:
  object-store-offsite-data:
  platform-db-data:
  keycloak-db-data:
  kafka-data:

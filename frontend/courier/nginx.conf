server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA HTML must not be cached, so a release is visible on the next load rather than behind a
    # stale cached index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    # The service worker and its manifest decide what every other file is: a cached copy would pin
    # a courier's phone to a build the next deploy has already replaced. The worker script is also
    # the one file the browser re-checks on its own schedule, and it only re-checks it fresh if the
    # server says not to keep it.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
        etag off;
    }

    # config.json is rewritten by docker-entrypoint.sh on every container start and read before the
    # app bootstraps. It must never be cached -- an exact match here wins over the extension rule
    # below regardless of file order, which is what keeps a stale issuer URL from surviving a
    # redeploy in a browser's cache.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    # The manifest is small and changes with releases; let the browser revalidate it.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed static assets can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/manifest+json;
}

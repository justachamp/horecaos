<header class="head">
  <span class="head__brand">{{ brandName }}</span>
  <button type="button" class="head__bell" [attr.aria-label]="'home.notifications' | t">
    <app-icon name="bell" [size]="21" />
  </button>
</header>

<div class="search">
  <app-icon name="search" [size]="18" />
  <span class="search__hint">{{ 'home.searchHint' | t }}</span>
</div>

<app-content-brand-switcher [entries]="brandSwitcher()" />
<app-content-stories [stories]="stories()" />
<app-content-carousel [items]="carousel()" />
<app-content-promo-grid [items]="promoGrid()" />
<app-editorial-links />

@switch (state()) {
  @case ('loading') {
    <p class="state">{{ 'common.loading' | t }}</p>
  }
  @case ('error') {
    <div class="state">
      <p>{{ 'home.loadError' | t }}</p>
      <button type="button" class="btn" (click)="load()">{{ 'common.retry' | t }}</button>
    </div>
  }
  @case ('ready') {
    <app-content-groups [groups]="groups()" [sections]="items()" [currency]="currency()" />
    @if (hasDishes()) {
      <app-menu-grid
        [categories]="categories()"
        [sections]="items()"
        [currency]="currency()"
        [requestedCategoryId]="category() ?? null"
        [layout]="layout()"
      />
    } @else {
      <p class="state">{{ 'home.emptyMenu' | t }}</p>
    }
  }
}

<app-public-reviews />
<app-content-popup [popup]="popup()" />

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA HTML must not be cached, so a release is visible on the next load
    # rather than behind a stale cached index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    # config.js is rewritten by docker-entrypoint.sh on every container start
    # and read before the application bootstraps. It must never be cached --
    # an exact match here wins over the extension rule below regardless of
    # file order, which is what keeps a stale issuer URL from surviving a
    # redeploy in a browser's cache.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        etag off;
    }

    # Hashed static assets can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

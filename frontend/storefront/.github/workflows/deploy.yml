name: Build & Deploy JizBiz Frontend

on:
  push:
    branches: [main, dev]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, "${{ github.ref_name == 'main' && 'prod' || 'dev' }}"]
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=/opt/www/jizbiz.horecaos.one" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
            echo "DEPLOY_PATH=/opt/www/dev.jizbiz.horecaos.one" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.set-env.outputs.ENV_NAME }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            BUILD_ENV=${{ steps.set-env.outputs.ENV_NAME }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:cache,mode=max

      - name: Deploy
        run: |
          cd ${{ steps.set-env.outputs.DEPLOY_PATH }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose pull frontend
          docker compose up -d --no-deps frontend
          docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

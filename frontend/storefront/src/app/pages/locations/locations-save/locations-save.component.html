<div class="flex min-h-screen flex-col bg-surface-base pb-32 text-text-primary">
  <div class="mx-auto w-full max-w-[420px] flex-1 px-4 py-4">
    <!-- Back -->
    <button
      type="button"
      appBack="/locations/add"
      class="app-back inline-flex items-center gap-2 text-sm transition-opacity hover:opacity-90"
    >
      <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      {{ 'common.back' | t }}
    </button>

    <h1 class="mt-4 text-xl font-bold text-text-primary">{{ 'locations.enterAddress' | t }}</h1>

    <!-- Address line (clickable to edit / go back to map) -->
    <a
      routerLink="/locations/add"
      class="mt-2 flex items-center justify-between gap-2 text-text-primary"
    >
      <span class="text-sm">{{ addressLine }}</span>
      <svg class="h-5 w-5 shrink-0 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </a>

    <!-- Location name -->
    <input
      type="text"
      [(ngModel)]="locationName"
      [placeholder]="'locations.locationNamePlaceholder' | t"
      class="mt-6 w-full rounded-xl border border-zinc-500 bg-surface-raised px-4 py-3 text-sm text-text-primary placeholder-zinc-500 focus:border-brand-accent focus:outline-none focus:ring-2 focus:ring-brand-accent"
    />

    <!-- Comment -->
    <!-- <textarea
      [(ngModel)]="comment"
      placeholder="Kommentariy manzilga"
      rows="3"
      class="mt-4 w-full resize-none rounded-xl border border-zinc-600 bg-surface-raised px-4 py-3 text-sm text-white placeholder-zinc-500 focus:border-brand-accent focus:outline-none"
    ></textarea> -->

    @if (error()) {
      <p class="mt-4 rounded-xl bg-red-500/20 px-4 py-3 text-center text-sm text-red-400">{{ error() }}</p>
    }

    <!-- Instructional text -->
    <p class="mt-6 text-center text-sm text-text-primary">
      {{ 'locations.instruction' | t }}
    </p>
  </div>

  <!-- Fixed Saqlash button above bottom-nav -->
  <div
    class="fixed left-1/2 z-40 w-full max-w-[420px] -translate-x-1/2 px-4 pt-2 pb-safe"
    style="bottom: 5.5rem"
  >
    <button
      type="button"
      (click)="save()"
      [disabled]="loading()"
      class="w-full rounded-xl bg-brand-accent py-3.5 text-base font-bold text-white transition-opacity disabled:opacity-50 hover:opacity-95"
    >
      @if (loading()) {
        {{ 'common.loading' | t }}
      } @else {
        {{ 'common.save' | t }}
      }
    </button>
  </div>

<div
  class="flex min-h-screen flex-col bg-jizbiz-bg py-6 text-jizbiz-text"
  style="padding-left: max(1rem, var(--safe-left, 0px)); padding-right: max(1rem, var(--safe-right, 0px));"
>
  <div class="mx-auto flex w-full max-w-[420px] flex-1 flex-col items-center">
    <!-- Back: accent link + Orqaga -->
    <div class="flex w-full">
      <button
        type="button"
        appBack="/auth/login"
        class="app-back inline-flex items-center gap-2 text-sm transition-opacity hover:opacity-90"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
        {{ 'common.back' | t }}
      </button>
    </div>

    <!-- Title: centered, white, bold -->
    <h1 class="mt-8 text-center text-2xl font-bold text-jizbiz-text">{{ 'auth.codeTitle' | t }}</h1>
    <!-- Phone: two lines – number then "raqamiga yuborildi" in lighter gray -->
    <p class="mt-3 text-center text-base text-jizbiz-text">{{ phoneDisplay }}</p>
    <p class="mt-0.5 text-center text-sm text-zinc-400">{{ 'auth.codeSentTo' | t }}</p>

    <!-- 6 digit inputs: first accepts full code for iOS/Chrome autofill (only first box gets it) -->
    <div class="mt-8 flex gap-2">
      @for (i of [0,1,2,3,4,5]; track i) {
        <input
          [attr.data-code-input]="i"
          type="tel"
          inputmode="numeric"
          [attr.maxlength]="i === 0 ? 6 : 1"
          [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
          [value]="digitAt(i)"
          (input)="onDigitInput(i, $any($event.target).value)"
          (paste)="onPaste($event)"
          (keydown)="onDigitKeydown(i, $event)"
          class="h-11 w-11 flex-1 rounded-lg border-2 bg-jizbiz-surface text-center text-lg font-bold text-jizbiz-text focus:border-jizbiz-accent focus:outline-none focus:ring-2 focus:ring-jizbiz-accent"
          [class.border-zinc-500]="!digitAt(i)"
          [class.border-jizbiz-accent]="digitAt(i)"
        />
      }
    </div>

    @if (error()) {
      <p class="mt-4 text-center text-sm text-red-400">{{ error() }}</p>
    }
    @if (showResend()) {
      <div class="mt-6 text-center">
        <p class="text-sm text-zinc-400">{{ 'auth.noCodeReceived' | t }}</p>
        <button
          type="button"
          (click)="resend()"
          class="mt-1 text-sm font-medium text-jizbiz-accent underline transition-opacity hover:opacity-90"
        >
          {{ 'auth.resendCode' | t }}
        </button>
      </div>
    } @else {
      <p class="mt-6 text-center text-lg font-semibold text-jizbiz-accent">{{ formatTime(countdown()) }}</p>
    }

    <button
      type="button"
      (click)="submit()"
      [disabled]="code().length !== 6 || loading()"
      class="mt-10 w-full rounded-xl py-3.5 text-base font-bold transition-opacity disabled:opacity-50"
      [class.bg-jizbiz-accent]="code().length === 6 && !loading()"
      [class.text-white]="code().length === 6 && !loading()"
      [class.bg-jizbiz-surface-2]="code().length !== 6 || loading()"
      [class.text-jizbiz-muted]="code().length !== 6 || loading()"
    >
      @if (loading()) {
        {{ 'common.loading' | t }}
      } @else {
        {{ 'auth.confirm' | t }}
      }
    </button>
  </div>
</div>

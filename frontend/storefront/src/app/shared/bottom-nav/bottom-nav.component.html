<nav
  class="relative z-50 shrink-0"
  style="padding: 0.75rem 0.75rem calc(0.75rem + var(--safe-bottom, 0px));"
>
  <div class="mx-auto max-w-[420px] rounded-[22px] bg-surface-raised px-6 py-3 shadow-nav">
    <ul class="grid grid-cols-4 items-center text-center">
      <li>
        <a
          routerLink="/home"
          [class.text-brand-accent]="isTabActive('home')"
          [class.text-zinc-400]="!isTabActive('home')"
          class="flex flex-col items-center gap-1 text-[11px]"
        >
          <span
            class="nav-icon h-6 w-6"
            role="img"
            [attr.aria-label]="'nav.home' | t"
            [style.--nav-icon]="'url(/assets/nav-icons/home.svg)'"
          ></span>
          {{ 'nav.home' | t }}
        </a>
      </li>
      <li>
        <a
          routerLink="/cart"
          [class.text-brand-accent]="isTabActive('cart')"
          [class.text-zinc-400]="!isTabActive('cart')"
          class="relative flex flex-col items-center gap-1 text-[11px]"
        >
          <span class="relative inline-block">
            <span
            class="nav-icon h-6 w-6"
            role="img"
            [attr.aria-label]="'nav.cart' | t"
            [style.--nav-icon]="'url(/assets/nav-icons/cart.svg)'"
          ></span>
            @if (cart.totalItemsCount() > 0) {
              <span
                class="absolute -right-1.5 -top-1.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-red-500 px-1 text-[10px] font-bold text-white"
              >
                {{ cart.totalItemsCount() > 99 ? '99+' : cart.totalItemsCount() }}
              </span>
            }
          </span>
          {{ 'nav.cart' | t }}
        </a>
      </li>
      <li>
        <a
          routerLink="/orders"
          [class.text-brand-accent]="isTabActive('orders')"
          [class.text-zinc-400]="!isTabActive('orders')"
          class="flex flex-col items-center gap-1 text-[11px]"
        >
          <span
            class="nav-icon h-6 w-6"
            role="img"
            [attr.aria-label]="'nav.orders' | t"
            [style.--nav-icon]="'url(/assets/nav-icons/list.svg)'"
          ></span>
          {{ 'nav.orders' | t }}
        </a>
      </li>
      <li>
        <a
          routerLink="/profile"
          [class.text-brand-accent]="isTabActive('profile')"
          [class.text-zinc-400]="!isTabActive('profile')"
          class="flex flex-col items-center gap-1 text-[11px]"
        >
          <span
            class="nav-icon h-6 w-6"
            role="img"
            [attr.aria-label]="'nav.profile' | t"
            [style.--nav-icon]="'url(/assets/nav-icons/profile.svg)'"
          ></span>
          {{ 'nav.profile' | t }}
        </a>
      </li>
    </ul>
  </div>
</nav>

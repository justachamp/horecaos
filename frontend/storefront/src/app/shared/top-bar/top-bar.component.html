<header class="flex items-center justify-between gap-4">
  <a routerLink="/locations" class="flex flex-1 items-center gap-2 text-left">
    <div class="flex min-w-0 flex-col">
      <span class="text-xs text-zinc-400">{{ addressLabel() || ('cart.deliveryAddress' | t) }}</span>
      <span
        [title]="addressValue() || ('cart.addressNotSelected' | t)"
        class="line-clamp-2 min-w-0 text-base font-semibold text-text-primary"
      >{{ addressValue() || ('cart.addressNotSelected' | t) }}</span>
    </div>
    <span class="text-zinc-400">›</span>
  </a>
  <button
    type="button"
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-surface-raised text-text-primary"
    aria-label="Notification"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M11.9961 2.51416C7.56185 2.51416 5.63519 6.5294 5.63519 9.18368C5.63519 11.1675 5.92281 10.5837 4.82471 13.0037C3.48376 16.4523 8.87614 17.8618 11.9961 17.8618C15.1152 17.8618 20.5076 16.4523 19.1676 13.0037C18.0695 10.5837 18.3571 11.1675 18.3571 9.18368C18.3571 6.5294 16.4295 2.51416 11.9961 2.51416Z"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M14.3059 20.5122C13.0116 21.9579 10.9926 21.9751 9.68591 20.5122"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="19" cy="5" r="3" fill="#F75555" />
    </svg>
  </button>
</header>

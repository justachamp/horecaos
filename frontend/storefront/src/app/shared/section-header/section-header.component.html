<div class="flex items-center justify-between">
  <h2 class="text-lg font-semibold text-jizbiz-text">{{ title() }}</h2>
  @if (actionRouterLink()) {
    <a
      [routerLink]="actionRouterLink()!"
      (click)="onActionClick()"
      class="text-sm text-zinc-400 transition hover:text-jizbiz-accent"
    >
      {{ actionLabel() }}
    </a>
  } @else if (actionHref()) {
    <a
      class="text-sm text-zinc-400 transition hover:text-jizbiz-accent"
      [href]="actionHref()!"
    >
      {{ actionLabel() }}
    </a>
  } @else {
    <span class="text-sm text-zinc-500">{{ actionLabel() }}</span>
  }
</div>

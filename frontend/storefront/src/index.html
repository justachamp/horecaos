<!doctype html>
<html lang="uz" data-theme="dark" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Storefront</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.classList.toggle('dark', theme === 'dark');
          root.classList.toggle('light', theme === 'light');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f1f7' : '#111111');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Telegram Mini App SDK - must load before other scripts -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <script>
      (function () {
        var path = location.pathname;
        var isEntry =
          path === '/' ||
          path === '/home' ||
          path.indexOf('/home/') === 0 ||
          path === '/auth' ||
          path === '/auth/login' ||
          path.indexOf('/auth/login/') === 0;
        if (!isEntry) return;
        var win = window;
        var isTg =
          !!(win.TelegramWebviewProxy && win.TelegramWebviewProxy.postEvent) ||
          !!(win.Telegram && win.Telegram.WebApp && win.Telegram.WebApp.initData);
        if (!isTg) return;
        var key = 'app_tg_entry_reload';
        var q = '_r';
        var url = new URL(location.href);
        if (url.searchParams.has(q)) {
          try {
            sessionStorage.setItem(key, '1');
          } catch (e) {}
          return;
        }
        try {
          if (sessionStorage.getItem(key) === '1') return;
        } catch (e) {}
        try {
          sessionStorage.setItem(key, '1');
        } catch (e) {}
        url.searchParams.set(q, String(Date.now()));
        location.replace(url.toString());
      })();
    </script>
    <!-- Yandex Maps API v2.1 loaded dynamically by YandexMapsService -->
    <!-- ADR 0106 (wave P35, gap-map row 10.8e): analytics is a per-brand runtime
       decision, never a build-time constant. This file used to carry one
       tenant's hard-coded, switched-off Yandex Metrika counter id — wrong for
       every other tenant and dead code for this one. `AnalyticsInjector`
       (`core/analytics/`) reads GET /api/v1/storefront/tenants/{tenantId}/brands/{brandId}/analytics
       once the brand is known and injects whichever of GTM/GA4/Search
       Console the tenant has actually configured; a brand with none
       configured injects nothing. -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

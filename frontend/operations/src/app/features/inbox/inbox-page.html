<!-- Same split as `orders-page.html`, and now literally the same component
     rather than a second copy of the same CSS (ADR 0101). The section key is
     `inbox`, so widening the order detail says nothing about this one. -->
<q-split-pane sectionKey="inbox" [docked]="docked()" [handleLabel]="'ui.splitPane.handle' | t">
  <section class="queue" [attr.aria-label]="'inbox.title' | t">
    <header class="queue__head">
      <h1 class="q-subhead">{{ 'inbox.title' | t }}</h1>
    </header>

    <div class="queue__body" data-testid="inbox-queue-body">
      <q-inbox-list />
    </div>
  </section>

  <aside
    qSplitDetail
    class="dock"
    data-testid="inbox-dock"
    [attr.aria-hidden]="docked() ? null : 'true'"
  >
    <router-outlet (activate)="docked.set(true)" (deactivate)="docked.set(false)" />
  </aside>
</q-split-pane>

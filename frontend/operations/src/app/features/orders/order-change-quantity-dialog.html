<q-modal
  [title]="'orders.amendment.command.CHANGE_LINE_QUANTITY' | t"
  [dismissible]="!busy()"
  (dismiss)="dismiss.emit()"
  data-testid="order-change-quantity-dialog"
>
  <label class="change-quantity-dialog__field">
    <span class="q-body-sm">{{ 'orders.dialog.changeQuantity.line' | t }}</span>
    <select
      class="change-quantity-dialog__select q-body-sm"
      [value]="selectedLineId()"
      (change)="selectLine($any($event.target).value)"
      data-testid="order-change-quantity-dialog-line"
    >
      @for (choice of choices(); track choice.lineId) {
        <option [value]="choice.lineId">
          @if (choice.isCombo) {
            {{
              'orders.dialog.changeQuantity.comboOption'
                | t: { name: choice.name, count: choice.current }
            }}
          } @else {
            {{ choice.name }} ({{ 'orders.detail.lines.column.quantity' | t }}:
            {{ quantityText(choice.current) }})
          }
        </option>
      }
    </select>
  </label>

  <label class="change-quantity-dialog__field">
    <span class="q-body-sm">{{
      'orders.dialog.changeQuantity.newQuantity' | t: { min: quantityText(minQuantity()) }
    }}</span>
    <input
      type="number"
      class="change-quantity-dialog__input q-body-sm"
      [min]="minQuantity()"
      [step]="step()"
      [attr.inputmode]="splittable() ? 'decimal' : 'numeric'"
      [attr.aria-invalid]="quantityProblem() !== null"
      [value]="quantity()"
      (input)="setQuantity($any($event.target).value)"
      data-testid="order-change-quantity-dialog-quantity"
    />
  </label>
  @if (splittable()) {
    <p
      class="q-caption change-quantity-dialog__step"
      [class.change-quantity-dialog__step--problem]="quantityProblem() !== null"
      [attr.role]="quantityProblem() !== null ? 'alert' : null"
      data-testid="order-change-quantity-dialog-step"
    >
      {{ 'orders.dialog.changeQuantity.step' | t: { step: stepText() } }}
    </p>
  }

  <ng-container qModalActions>
    <button
      type="button"
      class="change-quantity-dialog__dismiss q-body-sm"
      (click)="dismiss.emit()"
      [disabled]="busy()"
    >
      {{ 'orders.dialog.dismiss' | t }}
    </button>
    <button
      type="button"
      class="change-quantity-dialog__confirm q-body-sm"
      (click)="submit()"
      [disabled]="busy() || !canSubmit()"
      data-testid="order-change-quantity-dialog-confirm"
    >
      {{ 'orders.dialog.note.save' | t }}
    </button>
  </ng-container>
</q-modal>

<!-- The grid, the fixed dock width and the 1100px fallback moved to
     `q-split-pane` (ADR 0101), which adds what five hand-written copies of them
     never had: a drag handle and a width this section remembers. -->
<q-split-pane sectionKey="orders" [docked]="docked()" [handleLabel]="'ui.splitPane.handle' | t">
  <section class="queue" [attr.aria-label]="'orders.title' | t">
    <header class="queue__head">
      <h1 class="q-subhead">{{ 'orders.title' | t }}</h1>
      <a
        class="queue__drafts-link q-body-sm"
        routerLink="/orders/drafts"
        routerLinkActive="queue__drafts-link--active"
        data-testid="orders-drafts-link"
        >{{ 'orders.drafts.link' | t }}</a
      >
      <a
        class="queue__drafts-link q-body-sm"
        routerLink="/orders/reservations"
        routerLinkActive="queue__drafts-link--active"
        data-testid="orders-reservations-link"
        >{{ 'reservations.title' | t }}</a
      >
      <a
        class="queue__drafts-link q-body-sm"
        routerLink="/orders/call-centre"
        routerLinkActive="queue__drafts-link--active"
        data-testid="orders-call-centre-link"
        >{{ 'orders.callCentre.link' | t }}</a
      >
    </header>

    <!-- The queue table lives here. It scrolls its own body under this fixed
         header; the pane, not the page, is what scrolls. -->
    <div class="queue__body" data-testid="queue-body">
      <q-order-queue />
    </div>
  </section>

  <!-- The dock. The outlet stays mounted rather than being wrapped in an @if:
       an outlet that is created and destroyed cannot report its own
       activation, which is what drives the layout. `q-split-pane` collapses
       the column itself while `docked` is false. -->
  <aside
    qSplitDetail
    class="dock"
    data-testid="order-dock"
    [attr.aria-hidden]="docked() ? null : 'true'"
  >
    <router-outlet (activate)="docked.set(true)" (deactivate)="docked.set(false)" />
  </aside>
</q-split-pane>

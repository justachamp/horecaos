<div class="row-actions">
  @for (item of inlineActions(); track item.action.action + (item.action.targetStatus ?? '')) {
    <button
      type="button"
      class="row-actions__inline"
      [disabled]="busy()"
      (click)="actionClicked.emit({ action: item.action, event: $event })"
      [attr.data-testid]="'order-row-action-' + item.action.action"
    >
      {{ item.label }}
    </button>
  }
  <!-- §2.9: the overflow trigger renders on every row, terminal
       orders included — a closed actions[] never means there is
       nothing to do, only nothing left to mutate. Открыть and
       Копировать номер are client-only, capability-free reads
       (§2.9's general overflow list), so they lead every menu,
       terminal or not, ahead of whatever OrderActionsPolicy
       supplied for this status. -->
  <div class="row-actions__overflow">
    <button
      type="button"
      class="row-actions__overflow-trigger"
      [disabled]="busy()"
      (click)="overflowToggled.emit($event)"
      [attr.aria-label]="'orders.action.overflow' | t"
      [attr.aria-expanded]="overflowOpen()"
      data-testid="order-row-overflow-trigger"
    >
      <span aria-hidden="true">⋯</span>
    </button>
    @if (overflowOpen()) {
      <div class="row-actions__overflow-menu" data-testid="order-row-overflow-menu">
        <button
          type="button"
          class="row-actions__overflow-item"
          (click)="openClicked.emit($event)"
          data-testid="order-row-action-OPEN"
        >
          {{ 'orders.action.open' | t }}
        </button>
        <button
          type="button"
          class="row-actions__overflow-item"
          (click)="copyClicked.emit($event)"
          data-testid="order-row-action-COPY_NUMBER"
        >
          {{ 'orders.action.copyNumber' | t }}
        </button>
        @for (
          item of overflowActions();
          track item.action.action + (item.action.targetStatus ?? '')
        ) {
          <button
            type="button"
            class="row-actions__overflow-item"
            (click)="actionClicked.emit({ action: item.action, event: $event })"
            [attr.data-testid]="'order-row-action-' + item.action.action"
          >
            {{ item.label }}
          </button>
        }
      </div>
    }
  </div>
</div>

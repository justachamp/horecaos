<div class="delivery-shell">
  <nav class="delivery-shell__tabs" [attr.aria-label]="'delivery.nav.label' | t">

      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/dispatch"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.dispatch' | t }}</a
    >
    <a
      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/map"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.map' | t }}</a
    >
    <a
      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/zones"
      routerLinkActive="delivery-shell__tab--active"

      routerLink="/delivery/tariffs"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.tariffs' | t }}</a

    <a
      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/courier-rates"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.courierRates' | t }}</a

      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/shifts"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.shifts' | t }}</a

      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/courier-policy"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.courierPolicy' | t }}</a
    >
    <a
      class="delivery-shell__tab q-body-sm"
      routerLink="/delivery/dispatch-rules"
      routerLinkActive="delivery-shell__tab--active"
      >{{ 'delivery.nav.dispatchRules' | t }}</a

  <div class="delivery-shell__body">
    <router-outlet />
  </div>

<div class="shell">
  <nav class="shell__tabs">
    <a
      class="shell__tab"
      routerLink="/staff"
      routerLinkActive="shell__tab--on"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'staff.shell.people' | t }}
    </a>
    <a class="shell__tab" routerLink="/staff/roles" routerLinkActive="shell__tab--on">
      {{ 'staff.shell.roles' | t }}
    </a>
    <a class="shell__tab" routerLink="/staff/activity" routerLinkActive="shell__tab--on">
      {{ 'staff.shell.activity' | t }}
    </a>
    <a class="shell__tab" routerLink="/staff/approvals" routerLinkActive="shell__tab--on">
      {{ 'staff.shell.approvals' | t }}
    </a>
  </nav>
  <router-outlet />
</div>

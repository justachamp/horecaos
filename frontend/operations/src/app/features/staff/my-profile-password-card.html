<div class="card" id="password" data-testid="my-profile-password">
  <h3 class="q-emphasis">{{ 'staff.myProfile.password.title' | t }}</h3>
  <p class="q-body-sm">{{ 'staff.myProfile.password.lead' | t }}</p>
  <p class="q-caption muted" data-testid="password-ends-all">
    {{ 'staff.myProfile.password.endsAll' | t }}
  </p>

  @switch (mail()) {
    @case ('checking') {
      <p class="q-caption muted" data-testid="password-checking">
        {{ 'staff.myProfile.password.checking' | t }}
      </p>
    }
    @case ('missing') {
      <p class="q-body-sm no-mail" role="status" data-testid="password-no-mail">
        {{ 'staff.myProfile.password.noMail' | t }}
      </p>
    }
  }

  <button
    type="button"
    class="primary-button"
    (click)="change()"
    [disabled]="mail() === 'missing'"
    data-testid="password-change"
  >
    {{ 'staff.myProfile.password.action' | t }}
  </button>
</div>

      >{{ 'reports.nav.overview' | t }}</a

    <a
      class="reports-shell__tab q-body-sm"
      routerLink="/statistics/orders"
      routerLinkActive="reports-shell__tab--active"

      class="reports-shell__tab q-body-sm"
      routerLink="/statistics/staff"
      routerLinkActive="reports-shell__tab--active"
      >{{ 'reports.nav.staff' | t }}</a

      class="reports-shell__tab q-body-sm"
      routerLink="/statistics/customers"
      routerLinkActive="reports-shell__tab--active"
      >{{ 'reports.nav.customers' | t }}</a
    >
    <a
      class="reports-shell__tab q-body-sm"
      routerLink="/statistics/marketing"
      routerLinkActive="reports-shell__tab--active"
      >{{ 'reports.nav.marketing' | t }}</a

  <div class="reports-shell__body">
    <router-outlet />

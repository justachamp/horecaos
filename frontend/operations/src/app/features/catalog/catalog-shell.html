<div class="catalog-shell">
  <nav class="catalog-shell__tabs" [attr.aria-label]="'catalog.nav.label' | t">
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/products"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.products' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/categories"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.categories' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/menus"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.menus' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/import"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.import' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/publication"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.publication' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/prices"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.prices' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/reference-data"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.referenceData' | t }}</a
    >
    <a
      class="catalog-shell__tab q-body-sm"
      routerLink="/catalog/auto-add"
      routerLinkActive="catalog-shell__tab--active"
      >{{ 'catalog.nav.autoAdd' | t }}</a
    >
  </nav>
  <div class="catalog-shell__body">
    <router-outlet />
  </div>
</div>

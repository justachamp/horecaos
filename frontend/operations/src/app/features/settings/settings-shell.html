<div class="settings">
  <nav class="settings__rail" [attr.aria-label]="'settings.nav.title' | t">
    <h1 class="settings__title q-title">{{ 'settings.nav.title' | t }}</h1>

    @for (group of groups(); track group.label) {
      <div class="settings__group">
        <h2 class="settings__group-label q-caption">{{ group.label | t }}</h2>
        @for (item of group.items; track item.path) {
          <a
            class="settings__item q-body-sm"
            [routerLink]="item.path"
            queryParamsHandling="preserve"
            routerLinkActive="settings__item--on"
          >
            {{ item.label | t }}
          </a>
        }
      </div>
    }
  </nav>

  <div class="settings__content">
    <q-scope-bar
      [showBrandPicker]="scope.brands().length > 1"
      [brands]="scope.brands()"
      [selectedBrandId]="scope.brandId()"
      [locations]="scope.locations()"
      [selectedLocationId]="scope.locationId()"
      (brandChange)="onBrandChange($event)"
      (locationChange)="onLocationChange($event)"
    />
    <router-outlet />
  </div>
</div>

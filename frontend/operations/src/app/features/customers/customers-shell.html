<div class="shell">
  <nav class="shell__tabs" [attr.aria-label]="'customers.nav.label' | t">
    @if (capabilities.has('CUSTOMER_READ')) {
      <a
        class="shell__tab"
        routerLink="/customers"
        routerLinkActive="shell__tab--on"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ 'customers.nav.list' | t }}
      </a>
    }
    @if (capabilities.has('CUSTOMER_LEAD_READ')) {
      <a
        class="shell__tab"
        routerLink="/customers/leads"
        routerLinkActive="shell__tab--on"
        data-testid="customers-leads-tab"
      >
        {{ 'customers.nav.leads' | t }}
      </a>
    }
    <a class="shell__tab" routerLink="/customers/segments" routerLinkActive="shell__tab--on">
      {{ 'customers.nav.segments' | t }}
    </a>
    <a class="shell__tab" routerLink="/customers/reviews" routerLinkActive="shell__tab--on">
      {{ 'customers.nav.reviews' | t }}
    </a>
    <a
      class="shell__tab"
      routerLink="/customers/feedback-settings"
      routerLinkActive="shell__tab--on"
    >
      {{ 'customers.nav.feedbackSettings' | t }}
    </a>
  </nav>
  <router-outlet />
</div>

<span class="q-actor-chip" data-testid="q-actor-chip">
  <span
    class="q-actor-chip__marker"
    [class]="markerClass()"
    aria-hidden="true"
    data-testid="q-actor-chip-marker"
  ></span>
  <span class="q-actor-chip__label q-body-sm" data-testid="q-actor-chip-label">{{ label() }}</span>
</span>

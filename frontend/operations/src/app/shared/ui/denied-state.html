<div class="q-state q-state--denied" role="status" data-testid="q-denied-state">
  <p class="q-body q-state__title">{{ 'ui.denied.title' | t }}</p>

  @if (capability(); as name) {
    <p class="q-body-sm q-state__body">
      {{ 'ui.denied.capability' | t }}
      <!-- Mono, and never translated: this is the token a manager types into
           the role editor, not a word. -->
      <code class="q-mono q-state__capability" data-testid="q-denied-state-capability">{{
        name
      }}</code>
    </p>
  }

  <p class="q-body-sm q-state__body">{{ askKey() | t }}</p>

  <div class="q-state__actions">
    <ng-content />
  </div>
</div>

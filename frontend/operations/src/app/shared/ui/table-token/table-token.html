<div
  class="token"
  [class.token--dragging]="dragging()"
  [class.token--outOfService]="table().status === 'OUT_OF_SERVICE'"
  [class.token--archived]="table().status === 'ARCHIVED'"
  [class.token--occupied]="table().occupied === true"
  [class.token--claim]="table().claimUnconfirmed === true"
  [class.token--disabled]="disabled()"
  [style.transform]="'translate(' + renderX() + 'px, ' + renderY() + 'px)'"
  (pointerdown)="onPointerDown($event)"
  (pointermove)="onPointerMove($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  [attr.data-testid]="'table-token-' + table().tableId"
  [attr.aria-label]="table().displayName"
  role="button"
  tabindex="0"
>
  <span class="token__code q-body-sm">{{ table().code }}</span>
  <span class="token__seats q-caption">{{ table().seats }}</span>
  @if (table().occupied === true) {
    <span
      class="token__occupied"
      data-testid="table-token-occupied-badge"
      aria-hidden="true"
    ></span>
  }
  @if (table().selfSeated === true) {
    <span
      class="token__selfSeated"
      data-testid="table-token-self-seated-badge"
      [attr.data-claim]="table().claimUnconfirmed === true ? 'unconfirmed' : 'confirmed'"
      aria-hidden="true"
      >●</span
    >
  }
  @if (table().qrIssued) {
    <span class="token__qr" data-testid="table-token-qr-badge" aria-hidden="true">▦</span>
  }
</div>

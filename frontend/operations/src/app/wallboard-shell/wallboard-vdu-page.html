<q-vdu-wall
  [tickets]="tickets()"
  [policy]="latenessPolicy()"
  [timeZone]="timeZone"
  [phase]="phase()"
  [freshness]="freshnessState()"
  [freshnessLabel]="freshnessLabel()"
  [now]="now()"
  [stationLabel]="selectedStationLabel()"
>
  <div wallControls class="wv__controls">
    @if (stations().length > 0) {
      <label class="wv__stationFilter">
        <span class="wv__stationFilter-label">{{ 'wallboardVdu.stationFilter.label' | t }}</span>
        <select
          [value]="selectedStation()"
          (change)="onStationChange($any($event.target).value)"
          data-testid="wallboard-vdu-station-filter"
        >
          <option value="">{{ 'wallboardVdu.stationFilter.all' | t }}</option>
          @for (station of stations(); track station.stationId) {
            <option [value]="station.stationId">{{ stationLabel(station) }}</option>
          }
        </select>
      </label>
    }
    <q-live-badge [state]="connectionState()" />
  </div>
  <div wallBanners>
    <p class="wv__previewNote" data-testid="wallboard-vdu-preview-note">
      {{ 'wallboardVdu.previewNote' | t }}
    </p>
    <q-connection-state-banner [state]="connectionState()" />
  </div>
</q-vdu-wall>

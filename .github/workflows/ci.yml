name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Parallel Java test shards. Keep in step with `matrix.shard` in test-shard;
  # `make shards-test` fails when they disagree, because a shard nobody runs is a
  # slice of the suite that never runs.
  TEST_SHARDS: "3"
  # Two forks with an explicit ceiling each: the hosted runner's memory is the
  # binding constraint, not its cores. Measured 2026-09-16 with the full suite
  # (4866 tests) under exactly these flags: a long-lived fork peaks at ~2.3GB of
  # live heap once Spring's test-context cache fills (1.5g died of heap
  # exhaustion while loading a context), and metaspace stays under 1g; capping the
  # context cache at 8 keeps that peak bounded as the suite grows. A shard holds a
  # third of the suite, so its peak is no higher. The 'OutOfMemoryError: Metaspace'
  # lines in earlier CI logs were a test (ProcessFatalErrorTests) throwing that
  # error on purpose.
  TEST_JVM_ARGS: "-Xmx3g -XX:MaxMetaspaceSize=1g -Dspring.test.context.cache.maxSize=8"

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.filter.outputs.platform }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # A change to this workflow re-runs every gate: on 2026-09-16 a
            # workflow-only commit skipped Build and test yet still published
            # images, so an untested tree reached the registry under a fresh tag.
            platform:
              - 'platform/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'mobile/**'
              - '.github/workflows/**'

  # Deterministic repository rules. No JVM, no containers — this fails in under a
  # minute, so a policy violation never waits behind a full Maven build.
  lint:
    name: Repository rules
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # migration-safety compares against main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository hygiene
        run: python3 tools/checks/repo_hygiene.py

      - name: Documentation links
        run: python3 tools/checks/doc_links.py

      - name: Guardrail hooks
        run: python3 .claude/hooks/test_hooks.py

      - name: Control-band detection
        run: python3 ops/test_control_band.py

      - name: Test-shard partition is exact
        # Every test class in exactly one Java job, and ci.yml agreeing with the
        # partition about how many jobs there are. No JVM: this is the cheap half
        # of a guarantee whose other half (what the shards actually ran) is the
        # aggregator's verify-reports step.
        run: |
          python3 tools/ci/test_shard_tests.py
          python3 tools/ci/shard_tests.py check

      - name: Makefile reaches Maven under the build lock
        # make test/arch/verify go through tools/mvn-serial; make run compiles
        # under it and serves outside it, so a dev server never holds the tree.
        run: python3 tools/checks/test_makefile.py

      - name: Applied migrations are append-only
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MD \
            origin/${{ github.base_ref }}...HEAD -- src/main/resources/db/migration/ || true)
          if [ -n "$changed" ]; then
            echo "::error::An applied Flyway migration was modified or deleted:"
            echo "$changed"
            echo "Migrations are append-only. Add a new V00NN__*.sql instead."
            exit 1
          fi
          echo "No applied migration was modified."

  # The Java job used to be one runner, one `mvnw verify`, and took about eighty
  # minutes. It is now three kinds of job, so the wall time is the slowest shard
  # rather than the sum of all of them:
  #
  #   verify-static   spotless, the enforcer, packaging and the OpenAPI
  #                   compatibility/client diff -- the verify steps that are not
  #                   tests -- plus the one test class that writes the OpenAPI
  #                   documents. The only job that owns them.
  #   test-shard x N  a deterministic slice of the remaining test classes each,
  #                   chosen by tools/ci/shard_tests.py (recorded durations,
  #                   longest first, ties by name).
  #   verify          "Build and test": waits for both, proves every test class
  #                   ran exactly once, and enforces the JaCoCo coverage floor on
  #                   the union of every job's execution data.
  #
  # The aggregator keeps the id `verify` and the name "Build and test" so that
  # publish-images (and any branch protection added later) keeps depending on
  # one job that means "the whole Java build is green".
  verify-static:
    name: Static gates and OpenAPI
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Runner resources
        run: nproc && free -h && df -h / | tail -1

      - name: Pre-pull Testcontainers images
        run: tools/ci/pull-test-images.sh

      - name: Select the gate test classes
        run: python3 tools/ci/shard_tests.py includes --gate --out target/ci/gate-includes.txt

      - name: Verify
        # `verify` is where spotless:check, the enforcer and the jar packaging
        # live, so this job runs it whole -- but with only the gate classes as
        # tests. Their coverage is a fraction of the suite's, so the floor is
        # zeroed here; the aggregator enforces the real one over every job's
        # execution data. One fork is plenty for one class.
        run: >-
          ./mvnw --batch-mode verify
          -Dsurefire.includesFile="$PWD/target/ci/gate-includes.txt"
          -Dhorecaos.test.forks=1
          "-Dhorecaos.test.jvmArgs=$TEST_JVM_ARGS"
          -Dhorecaos.coverage.floor=0

      - name: OpenAPI compatibility and generated TypeScript clients
        run: |
          python3 tools/openapi/generate_types.py \
            --input target/openapi/horecaos-api-v1.json \
            --output target/openapi/horecaos-api-v1.ts
          diff -u api/generated/horecaos-api-v1.ts target/openapi/horecaos-api-v1.ts
          for group in storefront control-plane operations providers; do
            python3 tools/openapi/generate_types.py \
              --input "target/openapi/horecaos-api-v1.$group.json" \
              --output "target/openapi/horecaos-api-v1.$group.ts"
            diff -u "api/generated/horecaos-api-v1.$group.ts" "target/openapi/horecaos-api-v1.$group.ts"
          done

      - name: Name this job's coverage data
        if: always()
        run: cp target/jacoco.exec target/jacoco-gate.exec || true

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-gate
          path: platform/target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-gate
          path: platform/target/jacoco-gate.exec
          if-no-files-found: ignore

  test-shard:
    name: Tests (shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    # A shard should take a third of the old eighty minutes. The ceiling is well
    # past that but far below the old 150, so a wedged fork still fails the job.
    timeout-minutes: 90
    strategy:
      # A red shard must not hide a second red shard: every failure in the run
      # is worth seeing at once, and an aborted shard has no report to verify.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Runner resources
        run: nproc && free -h && df -h / | tail -1

      - name: Pre-pull Testcontainers images
        run: tools/ci/pull-test-images.sh

      - name: Select this shard's test classes
        run: >-
          python3 tools/ci/shard_tests.py includes
          --shards "$TEST_SHARDS" --index ${{ matrix.shard }}
          --out target/ci/shard-includes.txt

      - name: Test
        # `test`, not `verify`: formatting, packaging and the OpenAPI diff belong
        # to verify-static, and the coverage floor to the aggregator, because a
        # third of the suite covers a third of the code. The JaCoCo agent still
        # runs (it is bound before the tests), which is what produces the
        # execution data uploaded below.
        #
        # The include file, never -Dtest: Surefire falls back to running the
        # whole suite when a include file is empty, and the selection script
        # refuses to write an empty one.
        run: >-
          ./mvnw --batch-mode test
          -Dsurefire.includesFile="$PWD/target/ci/shard-includes.txt"
          -Dhorecaos.test.forks=2
          "-Dhorecaos.test.jvmArgs=$TEST_JVM_ARGS"

      - name: Name this shard's coverage data
        if: always()
        run: cp target/jacoco.exec "target/jacoco-shard-${{ matrix.shard }}.exec" || true

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: platform/target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-exec-shard-${{ matrix.shard }}
          path: platform/target/jacoco-shard-${{ matrix.shard }}.exec
          if-no-files-found: ignore

  verify:
    name: Build and test
    needs: [changes, verify-static, test-shard]
    # always(), and the explicit result check in the first step, are not
    # decoration. A job whose dependency failed is SKIPPED by default, and
    # publish-images reads "skipped" as "the path filter said nothing to test".
    # Without this the failure of any shard would let an untested tree publish.
    # The path-filter condition still skips this job when no platform file
    # changed, which is the only skip publish-images should accept.
    if: always() && needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - name: Every upstream job passed
        run: |
          echo "static gates: ${{ needs.verify-static.result }}"
          echo "test shards:  ${{ needs.test-shard.result }}"
          if [ "${{ needs.verify-static.result }}" != success ] || [ "${{ needs.test-shard.result }}" != success ]; then
            echo "::error::A Java job did not succeed, so the build is not green."
            exit 1
          fi

      - name: Download every job's test reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: platform/target/ci-reports

      - name: Every test class ran exactly once
        # The partition is exact on paper (make shards-test); this proves the
        # runners did what the plan said. A class that produced no report, ran
        # in the wrong job, or ran twice fails the build here.
        run: python3 tools/ci/shard_tests.py verify-reports --reports target/ci-reports

      - name: Rebuild the recorded test durations
        # Feeds only a future rebalance of the shards (it never changes what
        # runs), so a failure here must not turn the required check red.
        continue-on-error: true
        run: python3 tools/ci/shard_tests.py record --reports target/ci-reports/test-results-* --out target/ci/test-durations.tsv

      - name: Publish refreshed durations
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: platform/target/ci/test-durations.tsv
          if-no-files-found: ignore

      - name: Download every job's coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-exec-*
          path: platform/target/jacoco-shards
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Coverage floor over the merged execution data
        # ADR 0054's floor, unchanged, now applied to the union of what the
        # gate job and every shard executed. `compile` puts the classes the
        # execution data refers to in place; the three JaCoCo executions are the
        # ones pom.xml already defines (merge is unbound there on purpose).
        run: >-
          ./mvnw --batch-mode -DskipTests compile
          jacoco:merge@jacoco-merge-shards
          jacoco:report@jacoco-report
          jacoco:check@jacoco-check

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: platform/target/site/jacoco/
          if-no-files-found: ignore

  # Frontend jobs are placeholders until the workspace toolchain decision
  # (ADR 0052 checklist) is made; each app builds independently today.
  frontend-build:
    name: Frontend builds
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every app under frontend/ that carries a package.json. storefront-milliy
        # was missing from this list while three customer features shipped into
        # it -- reviews, promo codes and referrals -- so none of them was ever
        # built or tested by CI.
        app: [control-plane, operations, storefront, storefront-milliy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: frontend/${{ matrix.app }}
        run: npm ci

      - name: Lint (operations)
        # eslint-plugin-horecaos bans a raw `font-size: Npx` (the closed type
        # scale in tokens.css owns every size). The tree was clean when this step
        # was added; before it, three violations landed unnoticed because
        # nothing ran `npm run lint`. `lint:rules` proves the rule itself still
        # fails on a violation. `i18n:dead:test` runs every test under
        # tools/i18n: the dead-key tool, the catalogue split, and the check that
        # every route declares the message areas its screens need (so a screen
        # cannot open on raw keys) and that nothing but `core` is eager. The
        # other three apps have their own step below.
        if: matrix.app == 'operations'
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm run lint
          npm run lint:rules
          npm run i18n:dead:test

      - name: Lint (control-plane, storefront, storefront-milliy)
        # ESLint 8.57 with the typescript-eslint recommended rules, plus (control-plane
        # only, which vendors the closed type scale) the same horecaos px rule
        # operations enforces, imported from frontend/operations' plugin rather than
        # copied. Each app's tree was clean when this step was added. `lint:rules`
        # (frontend/tools/lint-config.test.mjs) feeds the configured linter code that
        # is wrong and code that is fine, so a config that silently lost its rules
        # fails here instead of passing for ever.
        if: matrix.app != 'operations'
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm run lint
          npm run lint:rules

      - name: Format check
        # The whole tree of every app, so a file cannot slip through unchecked.
        # This used to run prettier only on the files a change touched (measured
        # against a merge base, or against the tip a push replaced); a push whose
        # run was cancelled by a later one, or whose previous tip was missing from
        # the clone, was never checked for the files it brought. control-plane was
        # the last app on that ratchet; it was reformatted in one commit ("whole-tree
        # prettier, no behaviour change", as operations and both storefronts were
        # before it), so the plain script each app already has does the job. To fix
        # a failure: `npm run format` in the app.
        working-directory: frontend/${{ matrix.app }}
        run: npm run format:check

      - name: Design tokens drift check (control-plane)
        # control-plane vendors frontend/design-tokens/tokens.css. Its ESLint config
        # ignores that copy -- it is where the closed type scale is defined, so it is
        # the one file allowed a raw px font-size -- and prettier ignores it too, on
        # the strength of this check keeping it identical to the canonical sheet. Without
        # it an edit or a drift in the vendored copy merges unlinted, unformatted and
        # uncompared. A failure means the vendored copy was edited or the canonical
        # sheet moved; the script's output says which and what not to do. The step
        # is pinned by frontend/tools/test_format_changed.py.
        if: matrix.app == 'control-plane'
        working-directory: frontend/${{ matrix.app }}
        run: npm run check:tokens

      - name: Tooling tests (operations)
        # frontend/tools/test_format_changed.py tests the local changed-files
        # helper AND reads this file to prove that the lint and format steps
        # above are still wired in. It also runs prettier for real when the
        # dependencies are installed, which is why it comes after Install.
        if: matrix.app == 'operations'
        run: python3 frontend/tools/test_format_changed.py

      - name: Test and build
        working-directory: frontend/${{ matrix.app }}
        run: |
          npm test
          npm run build --if-present

  # ADR 0061: CI's job ends here — building and publishing pinned images.
  # There is no deploy step in this workflow and no SSH access from CI to
  # any host. A devops engineer pulls these tags by hand, following
  # platform/docs/runbooks/production-setup.md; an optional later step in
  # that runbook covers installing a CI deploy key if the owner ever wants
  # this job followed by an automatic deploy, but nothing here assumes that
  # will happen.
  #
  # `verify` below is the "Build and test" aggregator: it is green only when the
  # static-gate job and every test shard are, so this job needs no knowledge of
  # how many shards there are.
  #
  # Runs only on a push to main, after lint/verify/frontend-build succeed
  # (or were legitimately skipped by the path filter — a frontend-only merge
  # still needs verify's own jar, so this job's own path filter down in
  # `changes` intentionally does not narrow platform out; every push to main
  # rebuilds every image, because a stale image nobody rebuilt is worse than
  # a few redundant minutes of CI, and the git-sha tag makes every build
  # traceable to the exact commit either way).
  publish-images:
    name: Publish images (${{ matrix.image.name }})
    needs: [changes, lint, verify, frontend-build]
    if: |
      always() &&
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped') &&
      (needs.frontend-build.result == 'success' || needs.frontend-build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          # Backend, built from the platform/ context so each Dockerfile's
          # relative COPYs (src/, infra/backup/, etc.) resolve the same way
          # they do for a developer running `docker build` locally.
          - { name: horecaos-platform, context: platform, dockerfile: platform/Dockerfile }
          - { name: horecaos-platform-migrate, context: platform, dockerfile: platform/infra/production/migrate/Dockerfile }
          - { name: horecaos-platform-ops, context: platform, dockerfile: platform/infra/production/ops/Dockerfile }
          - { name: horecaos-postgres-postgis, context: platform/infra/postgres, dockerfile: platform/infra/postgres/Dockerfile }
          # Stock caddy:2.10-alpine with caddy-ratelimit added (ADR 0023 —
          # deploy/infra/caddy/Caddyfile and platform/infra/production/caddy/
          # Caddyfile both use `rate_limit`, which the stock image cannot
          # run). Same Dockerfile the build-on-server deploy path compiles
          # locally; here it is an eighth published tag like the rest.
          - { name: horecaos-edge, context: platform, dockerfile: platform/infra/production/caddy/Dockerfile }
          # Frontends — one image per app, per deploy/compose.production.yml's
          # own note on why they are not baked into the edge image.
          - { name: horecaos-storefront, context: frontend/storefront, dockerfile: frontend/storefront/Dockerfile }
          - { name: horecaos-control-plane, context: frontend/control-plane, dockerfile: frontend/control-plane/Dockerfile }
          - { name: horecaos-operations, context: frontend/operations, dockerfile: frontend/operations/Dockerfile }
    env:
      # ghcr.io is the recommendation (ADR 0061 leaves registry choice an
      # open input; ghcr costs nothing extra with the existing GitHub and
      # needs only the workflow-scoped GITHUB_TOKEN below, no separate
      # secret to provision). Overriding this ONE repository variable —
      # Settings -> Secrets and variables -> Actions -> Variables ->
      # HORECAOS_REGISTRY — is the whole of "publish somewhere else"; a
      # non-ghcr registry also needs its own login credentials, which this
      # job does not provide, so switching registries means adding a login
      # step here too.
      REGISTRY: ${{ vars.HORECAOS_REGISTRY || format('ghcr.io/{0}', github.repository) }}
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: startsWith(env.REGISTRY, 'ghcr.io')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image.name }}:${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ matrix.image.name }}:main
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          build-args: |
            GIT_SHA=${{ github.sha }}

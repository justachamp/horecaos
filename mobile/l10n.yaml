arb-dir: lib/src/l10n
template-arb-file: app_en.arb
output-dir: lib/src/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations

# A getter that can return null pushes a missing translation to the call site
# as a null check. It should not be possible to reach a call site at all.
nullable-getter: false

# Every message must carry a description in the template. A translator working
# from a bare key mistranslates, and nobody notices until a customer does.
required-resource-attributes: true

# gen_l10n falls back to the template locale for a missing message rather than
# failing. This file records what fell back; test/l10n/arb_parity_test.dart is
# what turns that into a build failure.
untranslated-messages-file: l10n_untranslated.json

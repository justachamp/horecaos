include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A analyzer hint is not a suggestion in this repository.
    todo: ignore
    unused_import: error
    unused_local_variable: error
    dead_code: error
  exclude:
    - lib/src/l10n/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_print: true
    cancel_subscriptions: true
    close_sinks: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    unawaited_futures: true
    use_super_parameters: true

# The design system's "no colour or font-size at a call site" rule is not
# expressible in the analyzer without custom_lint, which is another dependency
# and another thing that cannot be verified on this machine. It is enforced
# instead by test/design/design_system_lint_test.dart, which scans the sources.
# If custom_lint is adopted later, that test is what it replaces.
